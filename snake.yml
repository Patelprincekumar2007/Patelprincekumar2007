name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Patelprincekumar2007
        outputs: |
  dist/github-contribution-grid-snake.svg?color_snake=%2300BFFF&color_dots=%23161B22,%230A2540,%231B4F72,%232E86C1,%234FC3F7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
